<!DOCTYPE html>
<html>

<head>
<title>The Perfect Pencil Request Form</title>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>

<body>
<div class="title-bar">
☆ Draw Your Own Perfect Pencil! ☆
</div>
<div class="whiteboard-container">
<div class="toolbar">
<button id="penButton" class="tool">Draw</button>
<button id="eraserButton" class="tool">Erase</button>
<input type="color" id="colorPicker" class="tool" value="#000000">
<input type="range" id="brushSize" min="1" max="20" value="5" class="tool">
<button id="clearButton" class="tool clear-btn">Clear</button>
</div>
<div class="email-section">
<input type="email" id="userEmail" placeholder="Enter your email" required>
<button id="submitButton" class="tool submit-btn">Submit Drawing</button>
</div>
<canvas id="whiteboard"></canvas>
</div>

<style>
body{
display:flex;
flex-direction:column;
align-items:center;
padding-top:30px;
background:#f5f5f5;
font-family:Arial, sans-serif;
}
.title-bar{
width:500px;
margin:0 auto 15px;
padding:12px;
text-align:center;
font-size:20px;
font-weight:bold;
background:#fff;
border-radius:12px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}
.whiteboard-container{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
width:500px;
box-sizing:border-box;
}
.toolbar{
display:flex;
gap:5px;
margin-bottom:10px;
flex-wrap:wrap;
justify-content:center;
align-items:center;
}
canvas{
width:100%;
height:500px;
border:2px solid black;
touch-action:none;
background:white;
display:block;
}
.tool{
padding:4px 7px;
cursor:pointer;
}
.email-section{
display:flex;
gap:10px;
margin:10px 0 15px;
}
#userEmail{
flex:1;
padding:10px;
font-size:16px;
}
.submit-btn{
padding:10px;
font-size:16px;
}
</style>

<script>
emailjs.init("boT8hmXBZif-IykOd");
const canvas = document.getElementById("whiteboard");
const ctx = canvas.getContext("2d");
function resizeCanvas() {
canvas.width = canvas.offsetWidth;
canvas.height = canvas.offsetHeight;
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);
let painting = false;
let brushColor = "#000000";
let brushSize = 5;
let isErasing = false;
function getPos(e) {
const rect = canvas.getBoundingClientRect();
return {
x: e.clientX - rect.left,
y: e.clientY - rect.top
};
}
function startPainting(e) {
painting = true;
draw(e);
}
function stopPainting() {
painting = false;
ctx.beginPath();
}
function draw(e) {
if (!painting) return;
const pos = getPos(e);
ctx.lineWidth = brushSize;
ctx.lineCap = "round";
ctx.strokeStyle = isErasing ? "#ffffff" : brushColor;
ctx.lineTo(pos.x, pos.y);
ctx.stroke();
ctx.beginPath();
ctx.moveTo(pos.x, pos.y);
}
document.getElementById("penButton").onclick = () => isErasing = false;
document.getElementById("eraserButton").onclick = () => isErasing = true;

document.getElementById("colorPicker").oninput = (e) => {
brushColor = e.target.value;
};
document.getElementById("brushSize").oninput = (e) => {
brushSize = e.target.value;
};
document.getElementById("clearButton").onclick = () => {
ctx.clearRect(0, 0, canvas.width, canvas.height);
};
document.getElementById("submitButton").onclick = () => {
const userEmail = document.getElementById("userEmail").value.trim();
if (!userEmail) return alert("Please enter your email first! >:(");
const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
if (!emailPattern.test(userEmail)) return alert("Please enter a valid email! >:(");
const imageData = canvas.toDataURL("image/png");
emailjs.send("service_e8dvjjr", "template_22s7a18", {
user_email: userEmail,
drawing: imageData
})
.then(() => {
alert("Drawing submitted successfully!! We will reach out to you soon! :)");
document.getElementById("userEmail").value = "";
})
.catch((error) => {
console.error(error);
alert("Failed to send drawing, please try again. :(");
});
};
canvas.addEventListener("mousedown", startPainting);
canvas.addEventListener("mouseup", stopPainting);
canvas.addEventListener("mousemove", draw);
canvas.addEventListener("touchstart", (e) => {
e.preventDefault();
const t = e.touches[0];
canvas.dispatchEvent(new MouseEvent("mousedown", {
clientX: t.clientX,
clientY: t.clientY
}));
});
canvas.addEventListener("touchend", (e) => {
e.preventDefault();
canvas.dispatchEvent(new MouseEvent("mouseup"));
});
canvas.addEventListener("touchmove", (e) => {
e.preventDefault();
const t = e.touches[0];
canvas.dispatchEvent(new MouseEvent("mousemove", {
clientX: t.clientX,
clientY: t.clientY
}));
});
</script>
</body>
</html>
